<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="./public/css/app.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen">
  <div class="flex h-screen overflow-hidden">
    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <header class="bg-white border-b border-gray-200 px-6 py-4">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-bold text-gray-900">PDF Manager</h1>
          </div>
          <div class="flex items-center gap-3">
            <label id="selectAllContainer" class="flex items-center gap-2 cursor-pointer hidden">
              <input type="checkbox" id="selectAllCheckbox" class="w-4 h-4 text-blue-600 rounded">
              <span class="text-sm text-gray-700">Select All</span>
            </label>
            <button id="uploadBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 hidden">
              <i class="bi bi-plus"></i>
              Add PDFs
            </button>
            <input type="file" id="fileInput" accept=".pdf" multiple class="hidden">
          </div>
        </div>
      </header>

      <!-- Upload Zone / Pages Grid -->
      <div id="mainContent" class="flex-1 overflow-y-auto p-6">
        <!-- Initial Upload Zone -->
        <div id="uploadZone" class="drop-zone h-full flex flex-col items-center justify-center rounded-xl">
          <i class="bi bi-file-earmark-pdf text-6xl text-gray-400 mb-4"></i>
          <h2 class="text-xl font-semibold text-gray-700 mb-2">Drop PDF files here</h2>
          <p class="text-gray-500 mb-4">or click the upload button to browse</p>
          <button id="browseBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg">
            Browse Files
          </button>
        </div>

        <!-- Pages Grid (hidden initially) -->
        <div id="pagesGrid" class="hidden grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-3">
          <!-- Pages will be inserted here -->
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-80 bg-white border-l border-gray-200 flex flex-col overflow-hidden">
      <div class="flex-1 overflow-y-auto p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-3">Merge &amp; Split</h3>
        <p class="text-sm text-gray-600 mb-4">
          Select the pages you want, then merge them into one PDF or split them into separate files.
        </p>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Filename</label>
            <input type="text" id="outputFilename" placeholder="Example Document"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button id="mergeBtn" disabled
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600 text-white py-3 rounded-lg font-medium flex items-center justify-center gap-2">
              <i class="bi bi-files"></i>
              Merge
            </button>

            <button id="extractBtn" disabled
              class="w-full bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-green-600 text-white py-3 rounded-lg font-medium flex items-center justify-center gap-2">
              <i class="bi bi-scissors"></i>
              Split
            </button>
          </div>
        </div>
      </div>

      <!-- Stats Footer -->
      <div class="border-t border-gray-200 p-4 bg-gray-50">
        <div class="flex justify-between text-sm">
          <span class="text-gray-600">Total Pages:</span>
          <span id="totalPages" class="font-semibold text-gray-900">0</span>
        </div>
        <div class="flex justify-between text-sm mt-2">
          <span class="text-gray-600">Selected:</span>
          <span id="selectedPages" class="font-semibold text-blue-600">0</span>
        </div>
      </div>
    </aside>
  </div>

  <!-- Preview Overlay (full screen) -->
  <div id="previewModal" class="hidden">
    <div class="preview-toolbar">
      <div class="min-w-0">
        <h3 id="modalPageTitle" class="text-base font-semibold truncate">Page 1</h3>
        <p id="modalFileName" class="text-xs text-gray-400 truncate">filename.pdf</p>
      </div>
      <div class="flex items-center gap-1">
        <button id="zoomOutBtn" class="preview-btn" title="Zoom out (-)"><i class="bi bi-zoom-out"></i></button>
        <button id="zoomLevel" class="preview-btn zoom-level" title="Fit to screen (0)">100%</button>
        <button id="zoomInBtn" class="preview-btn" title="Zoom in (+)"><i class="bi bi-zoom-in"></i></button>
      </div>
      <div class="flex items-center gap-2">
        <button id="modalRotateBtn" class="preview-btn" title="Rotate">
          <i class="bi bi-arrow-clockwise"></i> Rotate
        </button>
        <button id="closeModal" class="preview-btn" title="Close (Esc)">
          <i class="bi bi-x-lg"></i> Close
        </button>
      </div>
    </div>

    <div id="modalCanvas"><!-- canvas inserted here --></div>

    <button id="prevPage" class="preview-nav preview-nav-prev" title="Previous (←)">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button id="nextPage" class="preview-nav preview-nav-next" title="Next (→)">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <script src="./public/js/main.js"></script>
</body>

</html>
