<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="./public/css/app.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen">
  <div class="flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">PDF Manager</h1>
      </div>
    </header>

    <!-- Upload Zone / Pages Grid -->
    <div id="mainContent" class="flex-1 overflow-y-auto p-6">
      <!-- Initial Upload Zone -->
      <div id="uploadZone" class="drop-zone h-full flex flex-col items-center justify-center rounded-xl cursor-pointer">
        <i class="bi bi-file-earmark-pdf text-6xl text-gray-400 mb-4"></i>
        <h2 class="text-xl font-semibold text-gray-700 mb-2">Drop PDFs here</h2>
        <p class="text-gray-500">or click anywhere to browse</p>
      </div>

      <!-- Pages Grid (hidden initially) -->
      <div id="pagesGrid" class="hidden grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-3">
        <!-- Pages will be inserted here -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 px-6 py-3">
      <div class="flex flex-wrap items-center gap-4">
        <!-- Select all + selected / total -->
        <div class="flex items-center gap-3">
          <label id="selectAllContainer" class="flex items-center gap-2 cursor-pointer hidden">
            <input type="checkbox" id="selectAllCheckbox" class="w-4 h-4 text-blue-600 rounded">
            <span class="text-sm text-gray-700">Select All</span>
          </label>
          <div class="text-sm text-gray-600 whitespace-nowrap" title="Selected / total pages">
            <span id="selectedPages" class="font-semibold text-blue-600">0</span><span class="text-gray-400">/</span><span id="totalPages" class="font-semibold text-gray-900">0</span>
          </div>
        </div>

        <!-- Filename + actions -->
        <div class="flex items-center gap-3 ml-auto">
          <input type="text" id="outputFilename" placeholder="Filename" aria-label="Filename"
            class="w-64 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">

          <button id="addPdfsBtn" type="button" title="Add PDFs" aria-label="Add PDFs"
            class="text-gray-700 hover:bg-gray-100 w-10 h-10 rounded-lg text-xl flex items-center justify-center">
            <i class="bi bi-file-earmark-plus"></i>
          </button>
          <input type="file" id="fileInput" accept=".pdf" multiple class="hidden">

          <button id="deleteSelectedBtn" disabled title="Delete selected pages" aria-label="Delete selected pages"
            class="text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent w-10 h-10 rounded-lg text-xl flex items-center justify-center">
            <i class="bi bi-trash"></i>
          </button>

          <button id="mergeBtn" disabled
            class="text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent px-5 py-2 rounded-lg font-medium flex items-center justify-center gap-2">
            <i class="bi bi-files"></i>
            Merge
          </button>

          <button id="extractBtn" disabled
            class="text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent px-5 py-2 rounded-lg font-medium flex items-center justify-center gap-2">
            <i class="bi bi-scissors"></i>
            Split
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Preview Overlay (full screen) -->
  <div id="previewModal" class="hidden">
    <div class="preview-toolbar">
      <div class="min-w-0">
        <h3 id="modalPageTitle" class="text-base font-semibold truncate">Page 1</h3>
        <p id="modalFileName" class="text-xs text-gray-400 truncate">filename.pdf</p>
      </div>
      <div class="flex items-center gap-1">
        <button id="zoomOutBtn" class="preview-btn" title="Zoom out (-)"><i class="bi bi-zoom-out"></i></button>
        <button id="zoomLevel" class="preview-btn zoom-level" title="Fit to screen (0)">100%</button>
        <button id="zoomInBtn" class="preview-btn" title="Zoom in (+)"><i class="bi bi-zoom-in"></i></button>
      </div>
      <div class="flex items-center gap-2">
        <button id="modalRotateBtn" class="preview-btn" title="Rotate page">
          <i class="bi bi-arrow-clockwise"></i> Rotate
        </button>
        <button id="modalDeleteBtn" class="preview-btn" title="Delete page">
          <i class="bi bi-trash"></i> Delete
        </button>
        <button id="closeModal" class="preview-btn preview-btn-icon" title="Close (Esc)" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <div id="modalCanvas"><!-- canvas inserted here --></div>

    <button id="prevPage" class="preview-nav preview-nav-prev" title="Previous (←)">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button id="nextPage" class="preview-nav preview-nav-next" title="Next (→)">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <script src="./public/js/main.js"></script>
</body>

</html>
