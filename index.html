<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Manager</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="./public/css/app.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Bricolage Grotesque"', '"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

</head>

<body class="bg-gray-50 min-h-screen antialiased">
  <div class="flex flex-col h-screen overflow-hidden">
    <header class="bg-white border-b border-gray-200 px-4 py-1">
      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
        <h1 class="font-display text-sm font-semibold text-gray-900 whitespace-nowrap">PDF Manager</h1>

        <input type="text" id="output-filename" placeholder="Filename" aria-label="Filename" spellcheck="false"
          class="w-64 h-8 px-3 text-sm font-medium text-center text-gray-900 placeholder-gray-400 bg-transparent border-0 rounded-lg hover:bg-gray-100 focus:bg-gray-100 focus:outline-none focus:ring-0">

        <div class="flex items-center justify-end gap-2">
          <button id="add-pdfs-btn" type="button" title="Import PDFs" class="toolbar-btn">
            <i class="bi bi-box-arrow-in-down"></i>
            Import
          </button>
          <input type="file" id="file-input" accept=".pdf" multiple class="hidden">

          <button id="export-btn" disabled title="Export selected pages" class="toolbar-btn">
            <i class="bi bi-box-arrow-up"></i>
            Export
          </button>
        </div>
      </div>
    </header>

    <div id="toolbar" role="toolbar" aria-label="Page tools"
      class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 bg-white border-b border-gray-200 px-4 py-1">
      <div class="flex items-center justify-start gap-2">
        <button id="delete-selected-btn" disabled title="Delete selected pages" class="toolbar-btn">
          <i class="bi bi-trash"></i>
          Delete
        </button>
        <button id="delete-last-pages-btn" disabled title="Delete the last page of each selected file" class="toolbar-btn">
          <i class="bi bi-file-earmark-minus"></i>
          Delete last pages
        </button>
      </div>

      <div class="flex items-center justify-center gap-2">
        <div id="view-toggle" role="group" aria-label="View mode"
          class="flex items-center p-0.5 bg-gray-100 rounded-full text-sm font-medium">
          <button type="button" data-view="pages" aria-pressed="true" title="Show every page"
            class="view-opt h-7 px-3 rounded-full flex items-center gap-1.5 transition-colors">
            <i class="bi bi-file-earmark-text"></i>Pages
          </button>
          <button type="button" data-view="files" aria-pressed="false" title="Show one card per PDF file"
            class="view-opt h-7 px-3 rounded-full flex items-center gap-1.5 transition-colors">
            <i class="bi bi-files"></i>Files
          </button>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2">
        <label title="Select all pages"
          class="flex items-center gap-2.5 h-8 pl-2 pr-3 rounded-full cursor-pointer hover:bg-gray-100 transition-colors has-[:disabled]:opacity-40 has-[:disabled]:cursor-not-allowed has-[:disabled]:hover:bg-transparent">
          <input type="checkbox" id="select-all-checkbox" disabled class="sr-only">
          <span class="circle-check">
            <i class="i-check bi bi-check-lg"></i>
            <i class="i-dash bi bi-dash-lg"></i>
          </span>
          <span class="text-sm font-medium text-gray-700 whitespace-nowrap">Select all</span>
          <span class="text-sm text-gray-400 tabular-nums whitespace-nowrap"><span id="selected-pages">0</span> of <span id="total-pages">0</span> selected</span>
        </label>
      </div>
    </div>

    <div id="main-content" class="flex-1 overflow-y-auto p-6 flex flex-col">
      <div id="upload-zone" class="group flex-1 -m-6 flex items-center justify-center">
        <div id="upload-box"
          class="w-[min(42rem,90vw)] h-96 flex flex-col items-center justify-center rounded-2xl cursor-pointer
                 border-2 border-dashed border-blue-200 bg-blue-50/60
                 hover:border-blue-300 hover:bg-blue-50
                 group-[.drag-over]:border-blue-400 group-[.drag-over]:bg-blue-100
                 transition-colors duration-150">
          <i class="bi bi-file-earmark-pdf text-6xl text-blue-300 mb-4"></i>
          <h2 class="font-display text-xl font-semibold text-gray-700 mb-2">Upload your PDFs</h2>
          <p class="text-gray-500">Drag and drop files anywhere, or click here to browse</p>
        </div>
      </div>

      <div id="pages-grid" class="hidden relative w-full grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-4">
      </div>
    </div>
  </div>

  <div id="export-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4"
    role="dialog" aria-modal="true" aria-labelledby="export-modal-title">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-xl h-[42rem] max-h-full flex flex-col p-8">
      <div class="flex items-center justify-between mb-2 shrink-0">
        <h3 id="export-modal-title" class="font-display text-xl font-semibold text-gray-900">Export</h3>
        <button id="export-close-btn" type="button" aria-label="Close" title="Close (Esc)"
          class="text-gray-500 hover:text-gray-900 hover:bg-gray-100 w-12 h-12 -mr-3 rounded-full flex items-center justify-center text-xl transition-colors">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <p class="text-base text-gray-500 mb-6 shrink-0">
        <span id="export-count" class="font-medium text-gray-700">0 pages</span> selected. Choose how to export them.
      </p>

      <div class="space-y-2 flex-1 min-h-0 overflow-y-auto -mx-2 px-2">
        <label class="radio-row">
          <input type="radio" name="exportMode" value="merge" class="sr-only" checked>
          <div class="radio-row-body">
            <i class="bi bi-files text-2xl"></i>
            <div>
              <div class="radio-row-title">Merge</div>
              <div id="merge-desc" class="radio-row-desc">Combine selected pages into one PDF</div>
            </div>
          </div>
          <i class="bi bi-check-lg radio-row-check"></i>
        </label>

        <label id="pair-merge-option" class="hidden flex items-center gap-3 w-fit ml-16 mb-1 py-1.5 pl-2 pr-4 rounded-full cursor-pointer hover:bg-gray-100 transition-colors">
          <input type="checkbox" id="pair-merge-checkbox" class="sr-only">
          <span class="circle-check">
            <i class="i-check bi bi-check-lg"></i>
          </span>
          <span class="text-sm text-gray-700">
            <span class="font-medium">Merge in pairs</span>
            <span class="block text-gray-500">Split the files into two equal halves, then merge them in matching order: the first file of each half, then the second of each half, and so on</span>
          </span>
        </label>

        <div id="extract-header" role="button" tabindex="0" class="radio-row-body cursor-pointer">
          <i class="bi bi-file-earmark-arrow-down text-2xl"></i>
          <div>
            <div class="radio-row-title">Extract</div>
            <div class="radio-row-desc">Export pages or files without merging them</div>
          </div>
        </div>

        <div id="extract-sub-options" class="hidden space-y-2">

          <label class="radio-row radio-row-sub">
            <input type="radio" name="exportMode" value="extract-only" class="sr-only">
            <div class="radio-row-body">
              <div>
                <div class="radio-row-title">Extract only</div>
                <div id="extract-only-desc" class="radio-row-desc">Export each selected page as its own PDF</div>
              </div>
            </div>
            <i class="bi bi-check-lg radio-row-check"></i>
          </label>

          <label id="extract-first-option" class="hidden radio-row radio-row-sub">
            <input type="radio" name="exportMode" value="extract-first" class="sr-only">
            <div class="radio-row-body">
              <div>
                <div class="radio-row-title">Extract first pages</div>
                <div class="radio-row-desc">Export the first page of each selected file</div>
              </div>
            </div>
            <i class="bi bi-check-lg radio-row-check"></i>
          </label>

          <label id="extract-last-option" class="hidden radio-row radio-row-sub">
            <input type="radio" name="exportMode" value="extract-last" class="sr-only">
            <div class="radio-row-body">
              <div>
                <div class="radio-row-title">Extract last pages</div>
                <div class="radio-row-desc">Export the last page of each selected file</div>
              </div>
            </div>
            <i class="bi bi-check-lg radio-row-check"></i>
          </label>

          <label class="radio-row radio-row-sub">
            <input type="radio" name="exportMode" value="extract-pages" class="sr-only">
            <div class="radio-row-body">
              <div>
                <div class="radio-row-title">Extract specific pages</div>
                <div id="extract-pages-desc" class="radio-row-desc">Export only the page numbers you enter</div>
              </div>
            </div>
            <i class="bi bi-check-lg radio-row-check"></i>
          </label>
          <div id="extract-pages-fields" class="hidden ml-16 mr-4">
            <input type="text" id="extract-pages-input" inputmode="numeric" autocomplete="off" spellcheck="false"
              placeholder="e.g. 3 or 2, 5, 9" aria-label="Page numbers"
              class="w-full h-10 px-4 text-sm text-gray-900 placeholder-gray-400 rounded-full bg-gray-100 border border-transparent focus:bg-white focus:border-gray-400 focus:outline-none">
            <p id="extract-pages-warning" class="hidden mt-2 pl-4 flex items-start gap-2 text-sm text-red-600" role="alert">
              <i class="bi bi-exclamation-triangle mt-0.5"></i>
              <span class="warning-text"></span>
            </p>
          </div>

          <label class="radio-row radio-row-sub">
            <input type="radio" name="exportMode" value="extract-range" class="sr-only">
            <div class="radio-row-body">
              <div>
                <div class="radio-row-title">Extract page range</div>
                <div id="extract-range-desc" class="radio-row-desc">Export every page from one number to another</div>
              </div>
            </div>
            <i class="bi bi-check-lg radio-row-check"></i>
          </label>
          <div id="extract-range-fields" class="hidden ml-16 mr-4">
            <div class="flex items-center gap-3 text-sm text-gray-500">
              <span>From</span>
              <input type="text" id="extract-from-input" inputmode="numeric" autocomplete="off" placeholder="1" aria-label="First page"
                class="w-24 h-10 px-4 text-sm text-gray-900 placeholder-gray-400 rounded-full bg-gray-100 border border-transparent focus:bg-white focus:border-gray-400 focus:outline-none">
              <span>to</span>
              <input type="text" id="extract-to-input" inputmode="numeric" autocomplete="off" placeholder="5" aria-label="Last page"
                class="w-24 h-10 px-4 text-sm text-gray-900 placeholder-gray-400 rounded-full bg-gray-100 border border-transparent focus:bg-white focus:border-gray-400 focus:outline-none">
            </div>
            <p id="extract-range-warning" class="hidden mt-2 pl-4 flex items-start gap-2 text-sm text-red-600" role="alert">
              <i class="bi bi-exclamation-triangle mt-0.5"></i>
              <span class="warning-text"></span>
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between gap-4 mt-6 shrink-0">
        <label id="separate-option" class="flex items-center gap-3 w-fit py-1.5 pl-2 pr-4 rounded-full cursor-pointer hover:bg-gray-100 transition-colors">
          <input type="checkbox" id="separate-checkbox" class="sr-only">
          <span class="circle-check">
            <i class="i-check bi bi-check-lg"></i>
          </span>
          <span class="text-sm text-gray-700">
            <span class="font-medium">Save separately</span>
            <span class="block text-gray-500">One PDF per page or file</span>
          </span>
        </label>

        <div class="flex justify-end gap-3">
          <button id="export-cancel-btn" type="button"
            class="h-12 px-7 text-base font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors">Cancel</button>
          <button id="export-confirm-btn" type="button"
            class="h-12 px-7 text-base font-semibold text-white bg-gray-900 hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-full transition-colors">Export</button>
        </div>
      </div>
    </div>
  </div>

  <div id="preview-modal" class="hidden">
    <div class="preview-toolbar">
      <div class="min-w-0">
        <h3 id="modal-page-title" class="font-display text-base font-semibold truncate">Page 1</h3>
        <p id="modal-file-name" class="text-xs text-gray-400 truncate">filename.pdf</p>
      </div>
      <div class="flex items-center gap-1">
        <button id="zoom-out-btn" class="preview-btn" title="Zoom out (-)"><i class="bi bi-zoom-out"></i></button>
        <button id="zoom-level" class="preview-btn zoom-level" title="Fit to screen (0)">100%</button>
        <button id="zoom-in-btn" class="preview-btn" title="Zoom in (+)"><i class="bi bi-zoom-in"></i></button>
      </div>
      <div class="flex items-center gap-2">
        <button id="modal-open-btn" class="preview-btn" title="Open original PDF in a new tab at this page">
          <i class="bi bi-box-arrow-up-right"></i> Open
        </button>
        <button id="modal-rotate-btn" class="preview-btn" title="Rotate page">
          <i class="bi bi-arrow-clockwise"></i> Rotate
        </button>
        <button id="modal-delete-btn" class="preview-btn" title="Delete page">
          <i class="bi bi-trash"></i> Delete
        </button>
        <button id="close-modal" class="preview-btn preview-btn-icon" title="Close (Esc)" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <div id="modal-canvas"></div>

    <button id="prev-page" class="preview-nav preview-nav-prev" title="Previous (←)">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button id="next-page" class="preview-nav preview-nav-next" title="Next (→)">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <script src="./public/js/app-data.js"></script>
  <script src="./public/js/pdf-manager.js"></script>
  <script src="./public/js/main.js"></script>
</body>

</html>
