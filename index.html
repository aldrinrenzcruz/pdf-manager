<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="./public/css/app.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Bricolage Grotesque"', '"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

</head>

<body class="bg-gray-50 min-h-screen antialiased">
  <div class="flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 py-1">
      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
        <h1 class="font-display text-sm font-semibold text-gray-900 whitespace-nowrap">PDF Manager</h1>

        <input type="text" id="outputFilename" placeholder="Filename" aria-label="Filename" spellcheck="false"
          class="w-64 h-8 px-3 text-sm font-medium text-center text-gray-900 placeholder-gray-400 bg-transparent border-0 rounded-lg hover:bg-gray-100 focus:bg-gray-100 focus:outline-none focus:ring-0">

        <div class="flex items-center justify-end gap-2">
          <button id="addPdfsBtn" type="button" title="Import PDFs"
            class="text-gray-700 hover:bg-gray-100 h-8 px-3 text-sm rounded-lg font-medium flex items-center justify-center gap-1.5">
            <i class="bi bi-box-arrow-in-down"></i>
            Import
          </button>
          <input type="file" id="fileInput" accept=".pdf" multiple class="hidden">

          <button id="exportBtn" disabled title="Export selected pages"
            class="text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent h-8 px-3 text-sm rounded-lg font-medium flex items-center justify-center gap-1.5">
            <i class="bi bi-box-arrow-up"></i>
            Export
          </button>
        </div>
      </div>
    </header>

    <!-- Toolbar (shown once pages are loaded) -->
    <div id="selectAllContainer"
      class="hidden grid grid-cols-[1fr_auto_1fr] items-center gap-3 bg-white border-b border-gray-200 px-4 py-1">
      <!-- Left: selection -->
      <div class="flex items-center gap-2">
        <label title="Select all pages"
          class="flex items-center gap-2.5 h-8 pl-2 pr-3 rounded-full cursor-pointer hover:bg-gray-100 transition-colors">
          <input type="checkbox" id="selectAllCheckbox" class="peer sr-only">
          <span class="relative w-5 h-5 shrink-0 rounded-full border-2 border-gray-300 flex items-center justify-center text-white text-xs transition-colors
                       peer-checked:bg-gray-900 peer-checked:border-gray-900
                       peer-indeterminate:bg-gray-900 peer-indeterminate:border-gray-900
                       peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 peer-focus-visible:ring-offset-2
                       peer-checked:[&>.i-check]:opacity-100 peer-indeterminate:[&>.i-dash]:opacity-100">
            <i class="i-check bi bi-check-lg absolute opacity-0 transition-opacity"></i>
            <i class="i-dash bi bi-dash-lg absolute opacity-0 transition-opacity"></i>
          </span>
          <span class="text-sm font-medium text-gray-700 whitespace-nowrap">Select all</span>
          <span class="text-sm text-gray-400 tabular-nums whitespace-nowrap"><span id="selectedPages">0</span> of <span id="totalPages">0</span> selected</span>
        </label>
      </div>

      <!-- Center: delete -->
      <div class="flex items-center justify-center gap-2">
        <button id="deleteSelectedBtn" disabled title="Delete selected pages"
          class="text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent h-8 px-3 text-sm rounded-lg font-medium flex items-center justify-center gap-1.5">
          <i class="bi bi-trash"></i>
          Delete
        </button>
        <button id="deleteLastPagesBtn" disabled title="Delete the last page of each selected file"
          class="text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent h-8 px-3 text-sm rounded-lg font-medium flex items-center justify-center gap-1.5">
          <i class="bi bi-file-earmark-minus"></i>
          Delete last pages
        </button>
      </div>

      <!-- Right: view toggle -->
      <div id="toolbarActions" class="flex items-center justify-end gap-2">
        <div id="viewToggle" role="group" aria-label="View mode"
          class="flex items-center p-0.5 bg-gray-100 rounded-full text-sm font-medium">
          <button type="button" data-view="pages" aria-pressed="true" title="Show every page"
            class="view-opt h-7 px-3 rounded-full flex items-center gap-1.5 transition-colors">
            <i class="bi bi-file-earmark-text"></i>Pages
          </button>
          <button type="button" data-view="files" aria-pressed="false" title="Show one card per PDF file"
            class="view-opt h-7 px-3 rounded-full flex items-center gap-1.5 transition-colors">
            <i class="bi bi-files"></i>Files
          </button>
        </div>
      </div>
    </div>

    <!-- Upload Zone / Pages Grid -->
    <div id="mainContent" class="flex-1 overflow-y-auto p-6 flex flex-col">
      <!-- Initial Upload Zone -->
      <!-- The whole page area accepts dropped files; only the box in the middle opens the file picker on click -->
      <div id="uploadZone" class="drop-zone group flex-1 -m-6 flex items-center justify-center">
        <div id="uploadBox"
          class="w-[min(42rem,90vw)] h-96 flex flex-col items-center justify-center rounded-2xl cursor-pointer
                 border-2 border-dashed border-blue-200 bg-blue-50/60
                 hover:border-blue-300 hover:bg-blue-50
                 group-[.drag-over]:border-blue-400 group-[.drag-over]:bg-blue-100
                 transition-colors duration-150">
          <i class="bi bi-file-earmark-pdf text-6xl text-blue-300 mb-4"></i>
          <h2 class="font-display text-xl font-semibold text-gray-700 mb-2">Upload your PDFs</h2>
          <p class="text-gray-500">Drag and drop files anywhere, or click here to browse</p>
        </div>
      </div>

      <!-- Pages Grid (hidden initially) -->
      <div id="pagesGrid" class="hidden relative w-full grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-4">
        <!-- Pages will be inserted here -->
      </div>
    </div>
  </div>

  <!-- Export Modal -->
  <div id="exportModal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-4"
    role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-xl h-[42rem] max-h-full flex flex-col p-8">
      <div class="flex items-center justify-between mb-2 shrink-0">
        <h3 id="exportModalTitle" class="font-display text-xl font-semibold text-gray-900">Export</h3>
        <button id="exportCloseBtn" type="button" aria-label="Close" title="Close (Esc)"
          class="text-gray-500 hover:text-gray-900 hover:bg-gray-100 w-12 h-12 -mr-3 rounded-full flex items-center justify-center text-xl transition-colors">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <p class="text-base text-gray-500 mb-6 shrink-0">
        <span id="exportCount" class="font-medium text-gray-700">0 pages</span> selected. Choose how to export them.
      </p>

      <div class="space-y-2 flex-1 min-h-0 overflow-y-auto -mx-2 px-2">
        <!-- Merge -->
        <label class="relative block cursor-pointer">
          <input type="radio" name="exportMode" value="merge" class="peer sr-only" checked>
          <div class="flex items-center gap-4 pl-7 pr-16 py-4 rounded-full text-gray-700
                    hover:bg-gray-100 peer-checked:bg-gray-100
                    peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 transition-colors">
            <i class="bi bi-files text-2xl"></i>
            <div>
              <div class="text-base font-semibold text-gray-900">Merge</div>
              <div id="mergeDesc" class="text-sm text-gray-500">Combine selected pages into one PDF</div>
            </div>
          </div>
          <i class="bi bi-check-lg absolute right-7 top-1/2 -translate-y-1/2 text-xl text-gray-900 opacity-0 peer-checked:opacity-100 transition-opacity"></i>
        </label>

        <label id="pairMergeOption" class="hidden flex items-center gap-3 w-fit ml-16 mb-1 py-1.5 pl-2 pr-4 rounded-full cursor-pointer hover:bg-gray-100 transition-colors">
          <input type="checkbox" id="pairMergeCheckbox" class="peer sr-only">
          <span class="relative w-5 h-5 shrink-0 rounded-full border-2 border-gray-300 flex items-center justify-center text-white text-xs transition-colors
                       peer-checked:bg-gray-900 peer-checked:border-gray-900
                       peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 peer-focus-visible:ring-offset-2
                       peer-checked:[&>.i-check]:opacity-100">
            <i class="i-check bi bi-check-lg absolute opacity-0 transition-opacity"></i>
          </span>
          <span class="text-sm text-gray-700">
            <span class="font-medium">Merge in pairs</span>
            <span class="block text-gray-500">Split the files into two equal halves, then merge them in matching order: the first file of each half, then the second of each half, and so on</span>
          </span>
        </label>

        <!-- Extract group -->
        <div id="extractHeader" role="button" tabindex="0"
          class="flex items-center gap-4 pl-7 pr-16 py-4 rounded-full text-gray-700 cursor-pointer hover:bg-gray-100 transition-colors">
          <i class="bi bi-file-earmark-arrow-down text-2xl"></i>
          <div>
            <div class="text-base font-semibold text-gray-900">Extract</div>
            <div class="text-sm text-gray-500">Export pages or files without merging them</div>
          </div>
        </div>

        <!-- Extract sub items (only shown while Extract is selected) -->
        <div id="extractSubOptions" class="hidden space-y-2">

        <label id="extractOnlyOption" class="relative block cursor-pointer ml-10">
          <input type="radio" name="exportMode" value="extract-only" class="peer sr-only">
          <div class="flex items-center gap-4 pl-6 pr-14 py-3 rounded-full text-gray-700
                    hover:bg-gray-100 peer-checked:bg-gray-100
                    peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 transition-colors">
            <div>
              <div class="text-base font-medium text-gray-900">Extract only</div>
              <div id="extractOnlyDesc" class="text-sm text-gray-500">Export each selected page as its own PDF</div>
            </div>
          </div>
          <i class="bi bi-check-lg absolute right-6 top-1/2 -translate-y-1/2 text-xl text-gray-900 opacity-0 peer-checked:opacity-100 transition-opacity"></i>
        </label>

        <label id="extractFirstOption" class="hidden relative block cursor-pointer ml-10">
          <input type="radio" name="exportMode" value="extract-first" class="peer sr-only">
          <div class="flex items-center gap-4 pl-6 pr-14 py-3 rounded-full text-gray-700
                    hover:bg-gray-100 peer-checked:bg-gray-100
                    peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 transition-colors">
            <div>
              <div class="text-base font-medium text-gray-900">Extract first pages</div>
              <div class="text-sm text-gray-500">Export the first page of each selected file</div>
            </div>
          </div>
          <i class="bi bi-check-lg absolute right-6 top-1/2 -translate-y-1/2 text-xl text-gray-900 opacity-0 peer-checked:opacity-100 transition-opacity"></i>
        </label>

        <label id="extractLastOption" class="hidden relative block cursor-pointer ml-10">
          <input type="radio" name="exportMode" value="extract-last" class="peer sr-only">
          <div class="flex items-center gap-4 pl-6 pr-14 py-3 rounded-full text-gray-700
                    hover:bg-gray-100 peer-checked:bg-gray-100
                    peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 transition-colors">
            <div>
              <div class="text-base font-medium text-gray-900">Extract last pages</div>
              <div class="text-sm text-gray-500">Export the last page of each selected file</div>
            </div>
          </div>
          <i class="bi bi-check-lg absolute right-6 top-1/2 -translate-y-1/2 text-xl text-gray-900 opacity-0 peer-checked:opacity-100 transition-opacity"></i>
        </label>

        <!-- Extract specific pages -->
        <label id="extractPagesOption" class="relative block cursor-pointer ml-10">
          <input type="radio" name="exportMode" value="extract-pages" class="peer sr-only">
          <div class="flex items-center gap-4 pl-6 pr-14 py-3 rounded-full text-gray-700
                    hover:bg-gray-100 peer-checked:bg-gray-100
                    peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 transition-colors">
            <div>
              <div class="text-base font-medium text-gray-900">Extract specific pages</div>
              <div id="extractPagesDesc" class="text-sm text-gray-500">Export only the page numbers you enter</div>
            </div>
          </div>
          <i class="bi bi-check-lg absolute right-6 top-1/2 -translate-y-1/2 text-xl text-gray-900 opacity-0 peer-checked:opacity-100 transition-opacity"></i>
        </label>
        <div id="extractPagesFields" class="hidden ml-16 mr-4">
          <input type="text" id="extractPagesInput" inputmode="numeric" autocomplete="off" spellcheck="false"
            placeholder="e.g. 3 or 2, 5, 9" aria-label="Page numbers"
            class="w-full h-10 px-4 text-sm text-gray-900 placeholder-gray-400 rounded-full bg-gray-100 border border-transparent focus:bg-white focus:border-gray-400 focus:outline-none">
          <p id="extractPagesWarning" class="hidden mt-2 pl-4 flex items-start gap-2 text-sm text-red-600" role="alert">
            <i class="bi bi-exclamation-triangle mt-0.5"></i>
            <span class="warning-text"></span>
          </p>
        </div>

        <!-- Extract page range -->
        <label id="extractRangeOption" class="relative block cursor-pointer ml-10">
          <input type="radio" name="exportMode" value="extract-range" class="peer sr-only">
          <div class="flex items-center gap-4 pl-6 pr-14 py-3 rounded-full text-gray-700
                    hover:bg-gray-100 peer-checked:bg-gray-100
                    peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 transition-colors">
            <div>
              <div class="text-base font-medium text-gray-900">Extract page range</div>
              <div id="extractRangeDesc" class="text-sm text-gray-500">Export every page from one number to another</div>
            </div>
          </div>
          <i class="bi bi-check-lg absolute right-6 top-1/2 -translate-y-1/2 text-xl text-gray-900 opacity-0 peer-checked:opacity-100 transition-opacity"></i>
        </label>
        <div id="extractRangeFields" class="hidden ml-16 mr-4">
          <div class="flex items-center gap-3 text-sm text-gray-500">
            <span>From</span>
            <input type="text" id="extractFromInput" inputmode="numeric" autocomplete="off" placeholder="1" aria-label="First page"
              class="w-24 h-10 px-4 text-sm text-gray-900 placeholder-gray-400 rounded-full bg-gray-100 border border-transparent focus:bg-white focus:border-gray-400 focus:outline-none">
            <span>to</span>
            <input type="text" id="extractToInput" inputmode="numeric" autocomplete="off" placeholder="5" aria-label="Last page"
              class="w-24 h-10 px-4 text-sm text-gray-900 placeholder-gray-400 rounded-full bg-gray-100 border border-transparent focus:bg-white focus:border-gray-400 focus:outline-none">
          </div>
          <p id="extractRangeWarning" class="hidden mt-2 pl-4 flex items-start gap-2 text-sm text-red-600" role="alert">
            <i class="bi bi-exclamation-triangle mt-0.5"></i>
            <span class="warning-text"></span>
          </p>
        </div>
        </div>
      </div>

      <!-- Footer: checkbox on the left, buttons on the right (outside the scroll area) -->
      <div class="flex items-center justify-between gap-4 mt-6 shrink-0">
      <label id="separateOption" class="flex items-center gap-3 w-fit py-1.5 pl-2 pr-4 rounded-full cursor-pointer hover:bg-gray-100 transition-colors">
        <input type="checkbox" id="separateCheckbox" class="peer sr-only">
        <span class="relative w-5 h-5 shrink-0 rounded-full border-2 border-gray-300 flex items-center justify-center text-white text-xs transition-colors
                     peer-checked:bg-gray-900 peer-checked:border-gray-900
                     peer-focus-visible:ring-2 peer-focus-visible:ring-gray-400 peer-focus-visible:ring-offset-2
                     peer-checked:[&>.i-check]:opacity-100">
          <i class="i-check bi bi-check-lg absolute opacity-0 transition-opacity"></i>
        </span>
        <span class="text-sm text-gray-700">
          <span class="font-medium">Save separately</span>
          <span class="block text-gray-500">One PDF per page or file</span>
        </span>
      </label>

      <div class="flex justify-end gap-3">
        <button id="exportCancelBtn" type="button"
          class="h-12 px-7 text-base font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors">Cancel</button>
        <button id="exportConfirmBtn" type="button"
          class="h-12 px-7 text-base font-semibold text-white bg-gray-900 hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-full transition-colors">Export</button>
      </div>
      </div>
    </div>
  </div>

  <!-- Preview Overlay (full screen) -->
  <div id="previewModal" class="hidden">
    <div class="preview-toolbar">
      <div class="min-w-0">
        <h3 id="modalPageTitle" class="font-display text-base font-semibold truncate">Page 1</h3>
        <p id="modalFileName" class="text-xs text-gray-400 truncate">filename.pdf</p>
      </div>
      <div class="flex items-center gap-1">
        <button id="zoomOutBtn" class="preview-btn" title="Zoom out (-)"><i class="bi bi-zoom-out"></i></button>
        <button id="zoomLevel" class="preview-btn zoom-level" title="Fit to screen (0)">100%</button>
        <button id="zoomInBtn" class="preview-btn" title="Zoom in (+)"><i class="bi bi-zoom-in"></i></button>
      </div>
      <div class="flex items-center gap-2">
        <button id="modalOpenBtn" class="preview-btn" title="Open original PDF in a new tab at this page">
          <i class="bi bi-box-arrow-up-right"></i> Open
        </button>
        <button id="modalRotateBtn" class="preview-btn" title="Rotate page">
          <i class="bi bi-arrow-clockwise"></i> Rotate
        </button>
        <button id="modalDeleteBtn" class="preview-btn" title="Delete page">
          <i class="bi bi-trash"></i> Delete
        </button>
        <button id="closeModal" class="preview-btn preview-btn-icon" title="Close (Esc)" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <div id="modalCanvas"><!-- canvas inserted here --></div>

    <button id="prevPage" class="preview-nav preview-nav-prev" title="Previous (←)">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button id="nextPage" class="preview-nav preview-nav-next" title="Next (→)">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <script src="./public/js/main.js"></script>
</body>

</html>
